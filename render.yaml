services:
  # Backend API Server
  - type: web
    name: smartoffice-api
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GROK_API_KEY
        sync: false
      - key: GROK_API_URL
        value: https://api.groq.com/openai/v1
    
  # Frontend React App
  - type: web
    name: smartoffice-client
    runtime: node
    buildCommand: cd client && npm install && npm run build
    startCommand: cd client && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
